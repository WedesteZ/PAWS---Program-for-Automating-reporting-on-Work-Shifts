{% extends "base.html" %}

{% block content %}
    <h2 style="text-align: center; margin-bottom: 30px;">Авторизация в PAWS</h2>

    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" style="max-width: 400px; margin: 0 auto;">
        <div class="form-group">
            <label for="username">Имя пользователя (Логин):</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Войти в систему</button>
    </form>
{% endblock %}
