services:
  db:
    image: postgres:18
    container_name: paws-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paws"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  