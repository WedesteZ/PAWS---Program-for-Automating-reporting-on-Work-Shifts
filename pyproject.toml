[project]
name = "paws"
version = "0.1.0"
description = "Программа для автоматизации отчётности по рабочим сменам"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
paws = "src.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]